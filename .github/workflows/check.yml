name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: klburn-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ${{ (github.event_name == 'pull_request' || vars.CI_RUNNER != 'self-hosted') && 'ubuntu-24.04' || fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted", "Linux", "X64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require real lint tooling
        run: |
          if ! command -v shellcheck || ! command -v ip; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends shellcheck iproute2
          fi
          shellcheck --version
          ip -V
          test "$(uname -m)" = x86_64
          test "$(id -u)" != 0
      - name: Run non-root source regression
        env:
          CI_FIXTURE_DIR: ${{ github.event_name != 'pull_request' && secrets.CI_FIXTURE_DIR || '' }}
        run: |
          mkdir -p ci-reports
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            fixture="${CI_FIXTURE_DIR:?Configure CI_FIXTURE_DIR for trusted self-hosted regression}"
            [[ "$fixture" = /* ]]
            test -d "$fixture"
            test ! -e test_out && test ! -L test_out
            mkdir -m 700 test_out
            printf '%s\n' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > test_out/.ci-fixture-owner
            cleanup_fixture() {
              if [[ -d test_out && ! -L test_out && "$(cat test_out/.ci-fixture-owner)" == "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]; then
                rm -rf -- "$GITHUB_WORKSPACE/test_out"
              fi
            }
            trap cleanup_fixture EXIT
            cp -a "$fixture/." test_out/
          fi
          set -o pipefail
          ./tests/run-all.sh 2>&1 | tee ci-reports/source-checks.log
      - name: Record explicit release gaps
        if: always()
        run: |
          printf '%s\n' '### KLBurn source checks — NOT a release gate' 'Privileged ISO work requires a separate supported build backend, not this source-check Runner.' 'Root disk-exclusion, full/mem ISO build, firmware audit, real ISO QEMU/disk-stress, offline vendor parity and physical hardware acceptance: NOT_RUN.' 'Do not publish an ISO/tag based only on this workflow.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: source_primary
        if: always()
        continue-on-error: true
        with:
          name: klburn-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/
          if-no-files-found: error
      - name: Retry source evidence upload (action-only direct HTTPS)
        id: source_retry
        if: always() && steps.source_primary.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/scripts/ci-artifact-direct.cjs
        with:
          name: klburn-source-${{ github.run_id }}-${{ github.run_attempt }}-retry2
          path: ci-reports/
          if-no-files-found: error
      - name: Require finalized source evidence
        if: always()
        env:
          PRIMARY: ${{ steps.source_primary.outcome }}
          RETRY: ${{ steps.source_retry.outcome }}
        run: |
          if [[ "$PRIMARY" != success && "$RETRY" != success ]]; then
            echo 'No finalized source-check evidence artifact.' >&2
            exit 1
          fi
