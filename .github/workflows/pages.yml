name: Publish verified website
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '仅在网站内容审核完成且项目所有者明确同意后输入 PUBLISH；不授权发布 ISO'
        required: true
        type: string
      source_only:
        description: '仅发布源码介绍网站，必须没有任何 ISO/工具发布元数据'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: klburn-pages
  cancel-in-progress: false
jobs:
  pages:
    if: github.event.repository.private == false && vars.KLBURN_PUBLICATION_ENABLED == 'true' && inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require verified static release data
        env:
          SOURCE_ONLY: ${{ inputs.source_only }}
        run: |
          if [[ "$SOURCE_ONLY" == true ]]; then
            python3 -c 'import json; from pathlib import Path; data=json.loads(Path("site/releases.json").read_text()); assert data == {"schema": 1, "publication_ready": False, "releases": []}, "Source-only site must not contain release assets"'
          else
            python3 tools/update-site-release.py --check site/releases.json
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
